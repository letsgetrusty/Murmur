name: Release

# Publish a NOTARIZED release when a version tag is pushed — but ONLY once the
# Apple secrets are configured (the publish step is gated on APPLE_CONFIGURED).
#
# Until then, cut releases locally with `./scripts/publish-release.sh X.Y.Z`
# (self-signed, stable identity). This workflow deliberately does NOT publish an
# unsigned build on tag push, so it can't clobber a self-signed release that the
# script uploads for the same tag. Add the Apple secrets and this workflow takes
# over automatically — notarized, no edits needed. See docs/releasing.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release:
    # Apple Silicon runner → builds an aarch64 (darwin-aarch64) app, matching
    # the updater manifest's platform key.
    runs-on: macos-14
    env:
      # 'true' only once the Developer ID cert secret exists. Gates the Apple
      # signing step so builds stay ad-hoc (unsigned) until you add the cert —
      # tauri treats an *empty* APPLE_CERTIFICATE as "present" and fails, so we
      # must omit the Apple vars entirely rather than pass empty strings.
      APPLE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, so the changelog step can diff tags

      - name: Tag must match the app version
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != tauri.conf.json version v$v — bump the version in package.json, tauri.conf.json, and Cargo.toml first."
            exit 1
          fi

      # Guardrail: without the Apple secrets this workflow can't publish. A real
      # release is cut LOCALLY (scripts/publish-release.sh), which creates the tag
      # AND its GitHub release together — so if this tag has no release, someone
      # hand-pushed a bare tag expecting CI to publish. Fail loudly instead of a
      # silent no-op that looks like success. Poll briefly first so we don't race
      # publish-release.sh's own tag+release creation.
      - name: Require a release when CI can't publish
        if: env.APPLE_CONFIGURED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              echo "Release ${GITHUB_REF_NAME} exists — cut locally via scripts/publish-release.sh; nothing for CI to publish (Apple signing not configured)."
              exit 0
            fi
            echo "No release for ${GITHUB_REF_NAME} yet (attempt ${attempt}/6); waiting…"
            sleep 10
          done
          echo "::error::Tag ${GITHUB_REF_NAME} has no GitHub release and CI cannot publish one (Apple signing secrets are unset). Do NOT hand-push release tags — cut releases with ./scripts/publish-release.sh, which builds + publishes locally. Delete this tag, then re-cut with the script."
          exit 1

      # The steps below exist only to build + publish, which happens once the
      # Apple secrets are set — so gate them on APPLE_CONFIGURED. When it's unset,
      # the guardrail above is the whole job.
      - uses: actions/setup-node@v4
        if: env.APPLE_CONFIGURED == 'true'
        with:
          node-version: 22
          cache: npm

      # rustup reads rust-toolchain.toml (pins the compiler); this warms it.
      - name: Rust toolchain
        if: env.APPLE_CONFIGURED == 'true'
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        if: env.APPLE_CONFIGURED == 'true'
        with:
          # Cargo project lives in src-tauri/. Caches the registry AND target/,
          # so the heavy whisper.cpp/llama.cpp/onnxruntime C++ builds are reused.
          workspaces: src-tauri

      # esbuild 0.28's platform-optional packages trip a bug in npm 10 (bundled
      # with Node 22); npm 11 handles `npm ci` correctly.
      - name: Use npm 11
        if: env.APPLE_CONFIGURED == 'true'
        run: npm install -g npm@11

      - name: Install frontend deps
        if: env.APPLE_CONFIGURED == 'true'
        run: npm ci

      # Build the release notes from conventional-commit subjects since the
      # previous tag → categorized "### New / ### Fixed / ### Improved" markdown.
      # This becomes BOTH the GitHub release body AND latest.json's `notes`, which
      # the in-app update banner ("What's new") renders. Falls back to a plain
      # blurb if nothing user-facing landed. See settings.js → parseUpdateNotes.
      - name: Generate release notes
        if: env.APPLE_CONFIGURED == 'true'
        id: notes
        run: |
          current="${GITHUB_REF_NAME}"
          prev=$(git tag --sort=-v:refname | grep -vFx "$current" | head -1 || true)
          if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
          echo "Changelog range: ${prev:-<start>}..$current"
          new=""; fixed=""; improved=""
          while IFS= read -r subj; do
            [ -z "$subj" ] && continue
            if echo "$subj" | grep -qE '^[a-z]+(\([^)]*\))?!?:'; then
              type=$(echo "$subj" | sed -E 's/^([a-z]+).*/\1/')
              text=$(echo "$subj" | sed -E 's/^[a-z]+(\([^)]*\))?!?: *//')
            else
              type="other"; text="$subj"
            fi
            case "$type" in
              feat) new="${new}- ${text}"$'\n' ;;
              fix) fixed="${fixed}- ${text}"$'\n' ;;
              perf|refactor) improved="${improved}- ${text}"$'\n' ;;
              *) : ;; # docs/chore/ci/test/build/style/release/other → not user-facing
            esac
          done < <(git log --no-merges --pretty=%s "$range")
          body=""
          [ -n "$new" ] && body="${body}### New"$'\n'"${new}"$'\n'
          [ -n "$fixed" ] && body="${body}### Fixed"$'\n'"${fixed}"$'\n'
          [ -n "$improved" ] && body="${body}### Improved"$'\n'"${improved}"$'\n'
          if [ -z "$body" ]; then
            body="Download the .dmg below to install. Existing installs update automatically."
          fi
          {
            echo "body<<EOF_NOTES"
            printf '%s' "$body"
            echo
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      # ── Apple Developer ID + notarization — OPTIONAL (add later) ──────────
      # Runs only once the Apple secrets exist; then tauri-action signs with the
      # Developer ID under the hardened runtime + entitlements.plist, notarizes,
      # and staples. Until then this is skipped and the build is ad-hoc/unsigned
      # (installs, but Gatekeeper warns). Adding the secrets needs no edits here.
      - name: Configure Apple signing
        if: env.APPLE_CONFIGURED == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build, sign, and publish
        # Only publish from CI once Apple signing is configured — otherwise the
        # local self-signed release (scripts/publish-release.sh) owns the tag.
        if: env.APPLE_CONFIGURED == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          # Auto-provided by Actions; tauri-action needs it to create the release
          # and upload assets. Paired with `permissions: contents: write` above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (minisign) — REQUIRED for auto-update; separate from
          # Apple. TAURI_SIGNING_PRIVATE_KEY = contents of ~/.murmur/updater.key
          # (our key has no password, so the *_PASSWORD can be left unset). The
          # Apple vars, if configured, come from $GITHUB_ENV via the step above.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Murmur ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # Explicit host arch → outputs the darwin-aarch64 updater artifact +
          # latest.json (attached to the release) that the app's endpoint reads.
          args: --target aarch64-apple-darwin

      # tauri-action notarizes + staples the .app but NOT the .dmg, and it uploads
      # only the versioned DMG. Notarize + staple the DMG too (so opening the
      # downloaded disk image is Gatekeeper-clean, not just launching the app),
      # then re-upload it (--clobber replaces tauri-action's un-notarized copy)
      # plus a stable-named Murmur.dmg for the landing page's fixed
      # …/releases/latest/download/Murmur.dmg link.
      - name: Notarize the DMG + upload (versioned + stable Murmur.dmg)
        if: env.APPLE_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="$(find . -path '*/release/bundle/dmg/*_aarch64.dmg' | head -1)"
          [ -n "$dmg" ] || { echo "::error::no aarch64 .dmg found"; exit 1; }
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          cp "$dmg" "$(dirname "$dmg")/Murmur.dmg"
          gh release upload "${GITHUB_REF_NAME}" "$dmg" "$(dirname "$dmg")/Murmur.dmg" --clobber
