name: CI

# Keep main green: format, lint, and test on every PR to main (and on main
# itself). Mirrors the local pre-commit hook, as a backstop if it's bypassed.
on:
  pull_request:
    branches: [main]
    # Skip the (10x-billed) macOS build for changes that can't affect it —
    # docs, markdown, images, licence. A run only skips when EVERY changed file
    # matches, so a mixed code+docs commit still runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "**/*.png"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "**/*.png"
      - ".gitignore"

concurrency:
  # One run per branch/PR — cancel superseded runs to save the macOS minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS-native app (objc2 / AVFoundation / whisper.cpp + llama.cpp with
    # Metal), so it can only be built + tested on macOS. Apple Silicon runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rustup reads rust-toolchain.toml (pins the compiler); add the components
      # the checks need for that exact toolchain.
      - name: Rust toolchain
        run: |
          rustup show
          rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          # Caches the registry AND target/, so the heavy whisper.cpp /
          # llama.cpp / onnxruntime C++ builds are reused across runs.
          workspaces: src-tauri

      # esbuild 0.28's platform-optional packages trip a bug in npm 10 (bundled
      # with Node 22): `npm ci` errors EBADPLATFORM on other-OS optionals it
      # should skip. npm 11 handles them correctly.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install frontend deps
        run: npm ci

      # `generate_context!` embeds ../dist at compile time, so the frontend must
      # exist for clippy/test to compile the crate.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

  audit:
    # Advisory checks read lockfiles only (platform-independent), so run on the
    # cheap Ubuntu runner rather than macOS. Keeps known-vulnerable deps off main:
    # RustSec (cargo-audit) for Rust, `npm audit` for JS. Both gates tolerate
    # only the advisories explicitly accepted in src-tauri/.cargo/audit.toml and
    # scripts/npm-audit.sh — anything new fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See the check job: npm 11 is needed for esbuild 0.28's optional deps.
      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install frontend deps
        run: npm ci

      - name: npm audit
        run: ./scripts/npm-audit.sh

      - name: Rust toolchain
        run: rustup show

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (RustSec)
        run: ./scripts/audit.sh
