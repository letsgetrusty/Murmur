name: Release

# Publish a release when a version tag is pushed. To cut a release: bump the
# version in package.json + src-tauri/tauri.conf.json + src-tauri/Cargo.toml,
# commit, then:
#     git tag v0.2.0 && git push origin v0.2.0
#
# The build is ad-hoc (unsigned) until the Apple secrets below are added — it
# installs but Gatekeeper warns. Add the Apple secrets later and this same
# workflow notarizes; nothing else changes. See docs/releasing.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release:
    # Apple Silicon runner → builds an aarch64 (darwin-aarch64) app, matching
    # the updater manifest's platform key.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != tauri.conf.json version v$v — bump the version in package.json, tauri.conf.json, and Cargo.toml first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rustup reads rust-toolchain.toml (pins the compiler); this warms it.
      - name: Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo project lives in src-tauri/. Caches the registry AND target/,
          # so the heavy whisper.cpp/llama.cpp/onnxruntime C++ builds are reused.
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build, sign, and publish
        uses: tauri-apps/tauri-action@v0
        env:
          # ── Updater signing (minisign) — REQUIRED for auto-update ──────────
          # Separate from Apple. Add TAURI_SIGNING_PRIVATE_KEY as a repo secret:
          # the contents of ~/.openwispr/updater.key. Our key has no password, so
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD can be left unset.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ── Apple Developer ID + notarization — OPTIONAL (add later) ────────
          # Until set, the build is ad-hoc/unsigned. Once set, tauri-action
          # signs with the Developer ID under the hardened runtime + our
          # entitlements.plist, then notarizes + staples. See docs/releasing.md.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Open Wispr ${{ github.ref_name }}"
          releaseBody: "Download the .dmg below to install. Existing installs update automatically."
          releaseDraft: false
          prerelease: false
          # Explicit host arch → outputs the darwin-aarch64 updater artifact +
          # latest.json (attached to the release) that the app's endpoint reads.
          args: --target aarch64-apple-darwin
