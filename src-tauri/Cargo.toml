[package]
name = "murmur"
version = "0.3.0"
description = "Voice tool: on-device dictation, read-aloud TTS, and LLM refinement"
edition = "2021"
rust-version = "1.77"

# Targeted lints for AI-authored-code failure modes — not whole groups
# (pedantic/nursery are mostly style noise). The pre-commit hook's `-D warnings`
# turns these into commit-blocking errors.
[lints.clippy]
undocumented_unsafe_blocks = "warn" # every `unsafe` must justify its soundness
todo = "warn"                       # no leftover stubs
unimplemented = "warn"
dbg_macro = "warn"                  # no debug-print cruft

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Phase 1 — dictation loop
cpal = "0.16"
arboard = "3"
enigo = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "rt", "time"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
# ObjC completion-handler blocks — used to await AVCaptureDevice's async
# microphone-permission request (see permissions.rs). objc2 family, MIT.
block2 = "0.6"

# Phase B — dictation history (embedded, single-user)
rusqlite = { version = "0.32", features = ["bundled"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }
# default-features disabled to drop the `g2p-espeak` backend, which statically
# links GPL-3.0 espeak-ng — incompatible with our MIT license. Kokoro falls back
# to its dictionary-based (cmudict) grapheme-to-phoneme instead.
kokoro-en = { version = "0.1.5", default-features = false }
llama-cpp-2 = { version = "0.1.154", features = ["metal"] }

[profile.release]
# LTO + strip miscompile cpal's CoreAudio device enumeration into a
# null-pointer deref. Disable until we have a smaller repro to file
# upstream.
codegen-units = 1
lto = false
opt-level = 3
panic = "abort"
strip = false
